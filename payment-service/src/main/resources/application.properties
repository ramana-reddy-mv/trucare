spring.application.name=payment-service
server.port=${SERVER_PORT:8089}
spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/trucare_payments}
spring.datasource.username=${PAYMENT_DB_USERNAME:root}
spring.datasource.password=${PAYMENT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.cloud.openfeign.client.config.settlement-service.connect-timeout=2000
spring.cloud.openfeign.client.config.settlement-service.read-timeout=3000
spring.cloud.openfeign.client.config.settlement-service.logger-level=basic
springdoc.api-docs.path=/v3/api-docs

payment.security.operator-username=${PAYMENT_OPERATOR_USERNAME}
payment.security.operator-password=${PAYMENT_OPERATOR_PASSWORD}
payment.security.internal-username=${PAYMENT_INTERNAL_USERNAME}
payment.security.internal-password=${PAYMENT_INTERNAL_PASSWORD}
settlement.client.username=${SETTLEMENT_PAYMENT_USERNAME}
settlement.client.password=${SETTLEMENT_PAYMENT_PASSWORD}

payment.gateway.mode=${PAYMENT_GATEWAY_MODE:MOCK}
payment.gateway.mock.default-result=${PAYMENT_GATEWAY_MOCK_RESULT:SUCCESS}
payment.callback.retry.enabled=${PAYMENT_CALLBACK_RETRY_ENABLED:true}
payment.callback.retry.initial-delay-ms=${PAYMENT_CALLBACK_RETRY_INITIAL_DELAY_MS:1000}
payment.callback.retry.max-attempts=${PAYMENT_CALLBACK_RETRY_MAX_ATTEMPTS:5}
payment.callback.retry.fixed-delay-ms=${PAYMENT_CALLBACK_RETRY_FIXED_DELAY_MS:5000}
payment.callback.retry.stale-delivery-timeout-ms=${PAYMENT_CALLBACK_RETRY_STALE_TIMEOUT_MS:60000}
payment.reconciliation.enabled=${PAYMENT_RECONCILIATION_ENABLED:false}
