spring.application.name=policy-service
spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
security.jwt.public-key-base64=${TRUCARE_JWT_PUBLIC_KEY_BASE64}
security.jwt.issuer=${TRUCARE_JWT_ISSUER:trucare-auth-service}
server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_policies
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.member-service.connect-timeout=2000
spring.cloud.openfeign.client.config.member-service.read-timeout=3000
springdoc.api-docs.path=/v3/api-docs
