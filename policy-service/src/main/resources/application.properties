spring.application.name=policy-service
server.port=${SERVER_PORT:8087}

# PostgreSQL Server connection
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_policies
spring.datasource.username=postgres
spring.datasource.password=Youdontneed@123
