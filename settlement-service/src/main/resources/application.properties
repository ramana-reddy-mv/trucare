spring.application.name=settlement-service
server.port=${SERVER_PORT:8088}

# PostgreSQL Server connection
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_settlements
spring.datasource.username=postgres
spring.datasource.password=Youdontneed@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.openfeign.client.config.claim-service.connect-timeout=2000
spring.cloud.openfeign.client.config.claim-service.read-timeout=3000
springdoc.api-docs.path=/v3/api-docs

settlement.security.operator-username=${SETTLEMENT_OPERATOR_USERNAME}
settlement.security.operator-password=${SETTLEMENT_OPERATOR_PASSWORD}
settlement.security.payment-username=${SETTLEMENT_PAYMENT_USERNAME}
settlement.security.payment-password=${SETTLEMENT_PAYMENT_PASSWORD}

