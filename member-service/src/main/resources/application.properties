spring.application.name=member-service
spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_members
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
