spring.application.name=auth-service
spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_auth
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

security.jwt.secret-base64=${TRUCARE_JWT_SECRET_BASE64}
security.jwt.issuer=${TRUCARE_JWT_ISSUER:trucare-auth-service}
security.jwt.expiration-seconds=${TRUCARE_JWT_EXPIRATION_SECONDS:900}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
