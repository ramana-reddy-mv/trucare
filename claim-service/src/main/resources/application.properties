server.port=${SERVER_PORT:8083}
spring.application.name=claims-service
spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_claims
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.cloud.openfeign.client.config.policy-service.connect-timeout=2000
spring.cloud.openfeign.client.config.policy-service.read-timeout=3000
spring.cloud.openfeign.client.config.member-service.connect-timeout=2000
spring.cloud.openfeign.client.config.member-service.read-timeout=3000
spring.cloud.openfeign.client.config.provider-service.connect-timeout=2000
spring.cloud.openfeign.client.config.provider-service.read-timeout=3000

resilience4j.circuitbreaker.instances.memberValidation.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.memberValidation.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.memberValidation.slidingWindowSize=5
resilience4j.circuitbreaker.instances.memberValidation.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.memberValidation.failureRateThreshold=50
resilience4j.circuitbreaker.instances.memberValidation.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.memberValidation.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.memberValidation.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.memberValidation.maxAttempts=3
resilience4j.retry.instances.memberValidation.waitDuration=500ms
resilience4j.retry.instances.memberValidation.enableExponentialBackoff=true
resilience4j.retry.instances.memberValidation.exponentialBackoffMultiplier=2
resilience4j.retry.instances.memberValidation.retryExceptions[0]=feign.RetryableException
resilience4j.retry.instances.memberValidation.retryExceptions[1]=feign.FeignException.InternalServerError
resilience4j.retry.instances.memberValidation.retryExceptions[2]=feign.FeignException.BadGateway
resilience4j.retry.instances.memberValidation.retryExceptions[3]=feign.FeignException.ServiceUnavailable
resilience4j.retry.instances.memberValidation.retryExceptions[4]=feign.FeignException.GatewayTimeout

resilience4j.circuitbreaker.instances.providerValidation.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.providerValidation.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.providerValidation.slidingWindowSize=5
resilience4j.circuitbreaker.instances.providerValidation.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.providerValidation.failureRateThreshold=50
resilience4j.circuitbreaker.instances.providerValidation.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.providerValidation.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.providerValidation.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.providerValidation.maxAttempts=3
resilience4j.retry.instances.providerValidation.waitDuration=500ms
resilience4j.retry.instances.providerValidation.enableExponentialBackoff=true
resilience4j.retry.instances.providerValidation.exponentialBackoffMultiplier=2
resilience4j.retry.instances.providerValidation.retryExceptions[0]=feign.RetryableException
resilience4j.retry.instances.providerValidation.retryExceptions[1]=feign.FeignException.InternalServerError
resilience4j.retry.instances.providerValidation.retryExceptions[2]=feign.FeignException.BadGateway
resilience4j.retry.instances.providerValidation.retryExceptions[3]=feign.FeignException.ServiceUnavailable
resilience4j.retry.instances.providerValidation.retryExceptions[4]=feign.FeignException.GatewayTimeout

resilience4j.circuitbreaker.instances.policyEligibility.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.policyEligibility.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.policyEligibility.slidingWindowSize=5
resilience4j.circuitbreaker.instances.policyEligibility.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.policyEligibility.failureRateThreshold=50
resilience4j.circuitbreaker.instances.policyEligibility.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.policyEligibility.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.policyEligibility.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.policyEligibility.maxAttempts=2
resilience4j.retry.instances.policyEligibility.waitDuration=500ms
resilience4j.retry.instances.policyEligibility.enableExponentialBackoff=true
resilience4j.retry.instances.policyEligibility.exponentialBackoffMultiplier=2
resilience4j.retry.instances.policyEligibility.retryExceptions[0]=feign.RetryableException
resilience4j.retry.instances.policyEligibility.retryExceptions[1]=feign.FeignException.InternalServerError
resilience4j.retry.instances.policyEligibility.retryExceptions[2]=feign.FeignException.BadGateway
