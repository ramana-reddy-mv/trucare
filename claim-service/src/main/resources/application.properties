spring.jpa.hibernate.ddl-auto=update

# PostgreSQL Server connection
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_claims
spring.datasource.username=postgres
spring.datasource.password=Youdontneed@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


eureka.client.service-url.defaultZone= http://localhost:8761/eureka/

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.cloud.openfeign.client.config.policy-service.connect-timeout=2000
spring.cloud.openfeign.client.config.policy-service.read-timeout=3000

resilience4j.circuitbreaker.instances.memberValidation.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.memberValidation.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.memberValidation.slidingWindowSize=5
resilience4j.circuitbreaker.instances.memberValidation.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.memberValidation.failureRateThreshold=50
resilience4j.circuitbreaker.instances.memberValidation.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.memberValidation.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.memberValidation.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.memberValidation.maxAttempts=3
resilience4j.retry.instances.memberValidation.waitDuration=500ms
resilience4j.retry.instances.memberValidation.enableExponentialBackoff=true
resilience4j.retry.instances.memberValidation.exponentialBackoffMultiplier=2
resilience4j.retry.instances.memberValidation.retryExceptions[0]=feign.RetryableException
resilience4j.retry.instances.memberValidation.retryExceptions[1]=feign.FeignException.InternalServerError
resilience4j.retry.instances.memberValidation.retryExceptions[2]=feign.FeignException.BadGateway
resilience4j.retry.instances.memberValidation.retryExceptions[3]=feign.FeignException.ServiceUnavailable
resilience4j.retry.instances.memberValidation.retryExceptions[4]=feign.FeignException.GatewayTimeout

