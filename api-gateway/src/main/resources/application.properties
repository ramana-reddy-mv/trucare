spring.application.name=api-gateway
spring.main.web-application-type=reactive
server.port=${SERVER_PORT:8080}
spring.reactor.context-propagation=auto
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.tags.service=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms,5s
management.tracing.enabled=true
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.tracing.propagation.type=w3c
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENV:local}
