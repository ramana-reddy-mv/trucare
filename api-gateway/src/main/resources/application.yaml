server:
  port: 8080

security:
  jwt:
    public-key-base64: ${TRUCARE_JWT_PUBLIC_KEY_BASE64}
    issuer: ${TRUCARE_JWT_ISSUER:trucare-auth-service}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: claims-health
          uri: lb://claims-service
          predicates:
            - Path=/monitoring/claims/health
          filters:
            - SetPath=/actuator/health

        - id: members-health
          uri: lb://member-service
          predicates:
            - Path=/monitoring/members/health
          filters:
            - SetPath=/actuator/health

        - id: member-api
          uri: lb://member-service
          predicates:
            - Path=/api/members/**

        - id: provider-api
          uri: lb://provider-service
          predicates:
            - Path=/api/providers/**

        - id: claims-api
          uri: lb://claims-service
          predicates:
            - Path=/api/claims/**

        - id: care-api
          uri: lb://care-service
          predicates:
            - Path=/api/cares/**

        - id: document-api
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**

        - id: policy-api
          uri: lb://policy-service
          predicates:
            - Path=/api/policies/**

        - id: settlement-api
          uri: lb://settlement-service
          predicates:
            - Path=/api/settlements/**

        - id: payment-api
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        - id: notification-api
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**,/api/notification-templates/**

        - id: auth-api
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/members/**
          filters:
            - RewritePath=/members/(?<segment>.*), /api/members/${segment}

        - id: claims-service
          uri: lb://claims-service
          predicates:
            - Path=/claims/**
          filters:
            - RewritePath=/claims/(?<segment>.*), /api/claims/${segment}

        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/documents/**
          filters:
            - RewritePath=/documents/(?<segment>.*), /api/documents/${segment}

gateway:
  swagger:
    refresh-interval-ms: ${SWAGGER_REFRESH_INTERVAL_MS:15000}
    response-timeout-ms: ${SWAGGER_RESPONSE_TIMEOUT_MS:1000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    enabled: ${TRUCARE_OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${TRUCARE_OPENAPI_ENABLED:true}
    config-url: /swagger-config
