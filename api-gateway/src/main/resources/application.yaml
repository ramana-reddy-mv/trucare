server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/members/**
          filters:
            - RewritePath=/members/(?<segment>.*), /api/members/${segment}

        - id: care-management-service
          uri: lb://care-management-service
          predicates:
            - Path=/care-plans/**
          filters:
            - RewritePath=/care-plans/(?<segment>.*), /api/care-plans/${segment}

        - id: claims-service
          uri: lb://claims-service
          predicates:
            - Path=/claims/**
          filters:
            - RewritePath=/claims/(?<segment>.*), /api/claims/${segment}

        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/documents/**
          filters:
            - RewritePath=/documents/(?<segment>.*), /api/documents/${segment}

        - id: authorization-service
          uri: lb://authorization-service
          predicates:
            - Path=/authorizations/**
          filters:
            - RewritePath=/authorizations/(?<segment>.*), /api/authorizations/${segment}

        - id: audit-compliance-service
          uri: lb://audit-compliance-service
          predicates:
            - Path=/audit-compliance/**
          filters:
            - RewritePath=/audit-compliance/(?<segment>.*), /api/audit-compliance/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
