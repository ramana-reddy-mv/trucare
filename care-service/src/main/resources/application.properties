spring.application.name=ccare-service
spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
server.port=${SERVER_PORT:8082}
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_care
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
