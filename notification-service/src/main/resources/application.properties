spring.application.name=notification-service
server.port=${SERVER_PORT:8090}
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/trucare_notifications}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:postgres}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
springdoc.api-docs.path=/v3/api-docs

notification.security.internal-username=${NOTIFICATION_INTERNAL_USERNAME}
notification.security.internal-password=${NOTIFICATION_INTERNAL_PASSWORD}
notification.security.admin-username=${NOTIFICATION_ADMIN_USERNAME}
notification.security.admin-password=${NOTIFICATION_ADMIN_PASSWORD}

notification.email.mode=${NOTIFICATION_EMAIL_MODE:MOCK}
notification.email.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

notification.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:true}
notification.delivery.fixed-delay-ms=${NOTIFICATION_DELIVERY_FIXED_DELAY_MS:2000}
notification.delivery.batch-size=${NOTIFICATION_DELIVERY_BATCH_SIZE:20}
notification.delivery.max-attempts=${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
notification.delivery.initial-delay-ms=${NOTIFICATION_DELIVERY_INITIAL_DELAY_MS:1000}
notification.delivery.stale-processing-timeout-ms=${NOTIFICATION_STALE_PROCESSING_TIMEOUT_MS:60000}
