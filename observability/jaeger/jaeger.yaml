service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: primary_store
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      primary_store:
        opensearch:
          server_urls:
            - http://opensearch:9200
          indices:
            index_prefix: trucare
            spans:
              shards: 1
              replicas: 0
            services:
              shards: 1
              replicas: 0
            dependencies:
              shards: 1
              replicas: 0
            sampling:
              shards: 1
              replicas: 0

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: primary_store
