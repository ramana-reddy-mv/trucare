spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_documents
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

security.jwt.public-key-base64=${TRUCARE_JWT_PUBLIC_KEY_BASE64}
security.jwt.issuer=${TRUCARE_JWT_ISSUER:trucare-auth-service}
server.port=${SERVER_PORT:8084}
document.mountPath=${DOCUMENT_MOUNT_PATH:C:\\notes}
springdoc.api-docs.path=/v3/api-docs

springdoc.api-docs.enabled=${TRUCARE_OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${TRUCARE_OPENAPI_ENABLED:true}
