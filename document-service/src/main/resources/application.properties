spring.config.import=optional:file:../local-secrets.properties,optional:file:local-secrets.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/trucare_documents
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:8084}
document.mountPath=${DOCUMENT_MOUNT_PATH:C:\\notes}
springdoc.api-docs.path=/v3/api-docs
